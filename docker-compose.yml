services:
  server:
    build:
      context: ./
      dockerfile: ./server/Dockerfile
    container_name: server
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    restart: always
    networks:
      - app-network

  staff-client:
    build:
      context: ./
      dockerfile: ./staff-client/Dockerfile
    container_name: staff-client
    ports:
      - "3001:3001"
    env_file:
      - ./server/.env
    restart: always
    networks:
      - app-network

  website:
    build:
      context: ./website
      dockerfile: Dockerfile
    container_name: website
    ports:
      - "3000:3000"
    env_file:
      - ./website/.env
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
